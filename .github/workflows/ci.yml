name: ci

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck + build (pnpm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm 10, matches netlify.toml)
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install dependencies (frozen - reproducible)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + frontend)
        run: pnpm run typecheck:libs && pnpm --filter @workspace/legal-luminaire run typecheck

      - name: Run Vitest suite
        run: pnpm --filter @workspace/legal-luminaire run test

      - name: Build frontend (Vite)
        run: pnpm --filter @workspace/legal-luminaire run build

      - name: Verify publish directory exists
        run: test -d artifacts/legal-luminaire/dist/public

      # -----------------------------------------------------------------------
      # Week 2 - Route surface checks
      # -----------------------------------------------------------------------
      - name: Verify SPA index.html present (serves all client-side routes)
        run: test -f artifacts/legal-luminaire/dist/public/index.html

      - name: Verify _redirects present (SPA catch-all for Netlify)
        run: test -f artifacts/legal-luminaire/dist/public/_redirects

      - name: Verify _redirects content is correct SPA catch-all
        run: grep -q "^/\* /index.html 200" artifacts/legal-luminaire/dist/public/_redirects

      - name: Verify JS assets directory present (code-split route chunks)
        run: test -d artifacts/legal-luminaire/dist/public/assets

      - name: Verify case-selector and new data types compile cleanly
        run: pnpm --filter @workspace/legal-luminaire run typecheck

      # -----------------------------------------------------------------------
      # Week 3 - Document ingestion pipeline smoke tests
      # -----------------------------------------------------------------------
      - name: Smoke-test ingestion types imported in OmniDropzone
        run: |
          grep -q "ExtractionData" artifacts/legal-luminaire/src/components/views/OmniDropzone.tsx
          grep -q "IngestResponse"  artifacts/legal-luminaire/src/components/views/OmniDropzone.tsx
          grep -q "PreviewResponse" artifacts/legal-luminaire/src/components/views/OmniDropzone.tsx
          echo "OmniDropzone ingestion type imports: OK"

      - name: Smoke-test ReviewView uses typed props not any
        run: |
          grep -q "ReviewViewProps" artifacts/legal-luminaire/src/components/views/ReviewView.tsx
          grep -q "ExtractionTimelineEvent" artifacts/legal-luminaire/src/components/views/ReviewView.tsx
          if grep -q "}: any" artifacts/legal-luminaire/src/components/views/ReviewView.tsx; then
            echo "FAIL: ReviewView still has any props" && exit 1
          fi
          echo "ReviewView typed props: OK"

      - name: Smoke-test UploadView has state machine not disabled stub
        run: |
          grep -q "UploadPhase"     artifacts/legal-luminaire/src/components/views/UploadView.tsx
          grep -q "UploadFileState" artifacts/legal-luminaire/src/components/views/UploadView.tsx
          grep -q "uploadFile"      artifacts/legal-luminaire/src/components/views/UploadView.tsx
          echo "UploadView state machine: OK"

      - name: Smoke-test central types index has all ingestion types
        run: |
          grep -q "UploadStage"          artifacts/legal-luminaire/src/types/index.ts
          grep -q "PreviewResponse"      artifacts/legal-luminaire/src/types/index.ts
          grep -q "IngestResponse"       artifacts/legal-luminaire/src/types/index.ts
          grep -q "AutoResearchResponse" artifacts/legal-luminaire/src/types/index.ts
          grep -q "ExtractionData"       artifacts/legal-luminaire/src/types/index.ts
          grep -q "ReviewViewProps"      artifacts/legal-luminaire/src/types/index.ts
          echo "Central type index ingestion types: OK"

      - name: Final typecheck after all Week 3 changes
        run: pnpm --filter @workspace/legal-luminaire run typecheck

      # -----------------------------------------------------------------------
      # Week 4 - Guided-flow route surface and type-safety checks
      # -----------------------------------------------------------------------
      # Verifies the expanded route surface (new guided-flow routes, legacy
      # aliases) and the compile-time route safety types (FlatRoute, CasePath,
      # RouteId, isLpsRoute, LPS_ROUTE_MAP) are all present and correct.
      # Also confirms handleLpsNavigate no longer uses an unsafe `as` cast.
      # -----------------------------------------------------------------------

      - name: Smoke-test FlatRoute and CasePath unions present in types index
        run: |
          grep -q "FlatRoute"     artifacts/legal-luminaire/src/types/index.ts
          grep -q "CasePath"      artifacts/legal-luminaire/src/types/index.ts
          grep -q "RouteId"       artifacts/legal-luminaire/src/types/index.ts
          grep -q "isLpsRoute"    artifacts/legal-luminaire/src/types/index.ts
          grep -q "LPS_ROUTE_MAP" artifacts/legal-luminaire/src/types/index.ts
          echo "Route safety types present: OK"

      - name: Smoke-test new guided-flow routes registered in routes.tsx
        run: |
          grep -q "/verification-report" artifacts/legal-luminaire/src/routes.tsx
          grep -q "/filing-checklist"    artifacts/legal-luminaire/src/routes.tsx
          echo "New guided-flow routes registered: OK"

      - name: Smoke-test legacy alias /verification-report documented
        run: |
          grep -q "legacy alias" artifacts/legal-luminaire/src/routes.tsx
          echo "Legacy alias comment present: OK"

      - name: Smoke-test handleLpsNavigate uses type-guard not unsafe cast
        run: |
          grep -q "isLpsRoute" artifacts/legal-luminaire/src/routes.tsx
          grep -q "LPS_ROUTE_MAP" artifacts/legal-luminaire/src/routes.tsx
          if grep -q "as LpsRoute" artifacts/legal-luminaire/src/routes.tsx; then
            echo "FAIL: routes.tsx still has unsafe as LpsRoute cast" && exit 1
          fi
          echo "handleLpsNavigate uses type-guard: OK"

      - name: Smoke-test /verification-report and /filing-checklist in FlatRoute union
        run: |
          grep -q '"/verification-report"' artifacts/legal-luminaire/src/types/index.ts
          grep -q '"/filing-checklist"'    artifacts/legal-luminaire/src/types/index.ts
          echo "New routes present in FlatRoute union: OK"

      - name: Final typecheck after all Week 4 changes
        run: pnpm --filter @workspace/legal-luminaire run typecheck

      # -----------------------------------------------------------------------
      # Week 1 - Flag declaration check + spec-lint
      #
      # flag-type-check: fails if any VITE_FF_* env-var key referenced in
      #   source is not declared in src/lib/featureFlags.ts.
      #   Strategy: grep every VITE_FF_ usage across src/, then confirm each
      #   key exists as a declared flag in featureFlags.ts.
      #
      # spec-lint: each of the 8 spec directories must contain all three
      #   required files: requirements.md, design.md, tasks.md.
      # -----------------------------------------------------------------------
      - name: "Week 1: Flag-type-check — featureFlags.ts declares all 8 integration flags"
        run: |
          set -e
          FLAGS_FILE="artifacts/legal-luminaire/src/lib/featureFlags.ts"

          # Confirm the flags module exists
          if [ ! -f "$FLAGS_FILE" ]; then
            echo "FAIL: $FLAGS_FILE not found" && exit 1
          fi

          # Confirm all 8 integration flags are declared
          REQUIRED=(
            redaction_studio
            smart_drop
            ask_copilot
            citation_deeplink
            deadline_engine
            chronology_studio
            standards_explorer
            accuracy_academy
          )
          for FLAG in "${REQUIRED[@]}"; do
            if ! grep -q "$FLAG" "$FLAGS_FILE"; then
              echo "FAIL: flag '$FLAG' not declared in $FLAGS_FILE" && exit 1
            fi
            echo "  [OK] $FLAG"
          done

          # Confirm all flags default to false (no accidental ON in production)
          if grep -E ":\s*flag\([^,]+,\s*true\)" "$FLAGS_FILE"; then
            echo "FAIL: one or more integration flags default to true — all must default OFF" && exit 1
          fi

          echo "Flag-type-check: PASS — all 8 flags declared and defaulting OFF"

      - name: "Week 1: Spec-lint — all 8 spec packs contain requirements.md + design.md + tasks.md"
        run: |
          set -e
          SPECS=(
            redaction-studio
            smart-drop
            ask-copilot
            citation-deeplink
            deadline-engine
            chronology-studio
            standards-explorer
            accuracy-academy
          )
          FAIL=0
          for SPEC in "${SPECS[@]}"; do
            DIR=".kiro/specs/$SPEC"
            for FILE in requirements.md design.md tasks.md; do
              if [ ! -f "$DIR/$FILE" ]; then
                echo "FAIL: missing $DIR/$FILE"
                FAIL=1
              else
                echo "  [OK] $DIR/$FILE"
              fi
            done
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "Spec-lint: FAIL — one or more spec files missing" && exit 1
          fi
          echo "Spec-lint: PASS — all 8 spec packs complete"

      - name: "Week 1: Verify /system/flags route registered in routes.tsx"
        run: |
          grep -q "/system/flags" artifacts/legal-luminaire/src/routes.tsx
          grep -q "SystemFlagsPage" artifacts/legal-luminaire/src/routes.tsx
          echo "  [OK] /system/flags route registered"

      - name: "Week 1: Final typecheck after Week 1 changes"
        run: pnpm --filter @workspace/legal-luminaire run typecheck

      # -----------------------------------------------------------------------
      # Week 13 - Foundation Lock smoke-tests
      # Verifies: ADR library complete (ADR-001..008), feature flag matrix
      # present, competition readiness docs present, netlify.toml CSP header,
      # and protected source files integrity (never removed or broken).
      # -----------------------------------------------------------------------

      - name: "Week 13: ADR library complete — all 8 ADRs present"
        run: |
          set -e
          for N in 001 002 003 004 005 006 007 008; do
            FILE=$(find docs/adr -name "ADR-${N}-*.md" | head -1)
            if [ -z "$FILE" ]; then
              echo "FAIL: ADR-${N} not found in docs/adr/" && exit 1
            fi
            echo "  [OK] $FILE"
          done
          echo "ADR library check: PASS — all 8 ADRs present"

      - name: "Week 13: Feature flag matrix present and Week 13 dated"
        run: |
          set -e
          if [ ! -f "docs/FEATURE_FLAGS_MATRIX_W13.md" ]; then
            echo "FAIL: docs/FEATURE_FLAGS_MATRIX_W13.md not found" && exit 1
          fi
          grep -q "2026-09" docs/FEATURE_FLAGS_MATRIX_W13.md
          echo "  [OK] Feature flag matrix present and dated"

      - name: "Week 13: Competition readiness docs present"
        run: |
          set -e
          test -f docs/submission/JUDGE_WALKTHROUGH.md
          echo "  [OK] docs/submission/JUDGE_WALKTHROUGH.md present"
          test -f docs/enrichment/WEEK13_KIRO_COMPETITION_LOCK.md
          echo "  [OK] docs/enrichment/WEEK13_KIRO_COMPETITION_LOCK.md present"

      - name: "Week 13: netlify.toml has Content-Security-Policy header"
        run: |
          grep -q "Content-Security-Policy" netlify.toml
          echo "  [OK] CSP header present in netlify.toml"

      - name: "Week 13: Protected source files integrity check"
        run: |
          set -e
          PROTECTED=(
            "artifacts/legal-luminaire/src/App.tsx"
            "artifacts/legal-luminaire/src/main.tsx"
            "artifacts/legal-luminaire/src/index.css"
            "artifacts/legal-luminaire/src/context/CaseContext.tsx"
            "artifacts/legal-luminaire/src/context/AccuracyContext.tsx"
            "artifacts/legal-luminaire/src/lib/citation-gate.ts"
            "artifacts/legal-luminaire/src/components/CitationGatePanel.tsx"
            "artifacts/legal-luminaire/src/lib/verification-engine.ts"
            "artifacts/legal-luminaire/src/lib/case01-data.ts"
            "artifacts/legal-luminaire/vite.config.ts"
          )
          for F in "${PROTECTED[@]}"; do
            if [ ! -f "$F" ]; then
              echo "FAIL: Protected file missing: $F" && exit 1
            fi
            echo "  [OK] $F"
          done
          # vite.config.ts must NOT reference PORT or BASE_PATH env vars (Replit pattern)
          if grep -q "process.env.PORT\|process.env.BASE_PATH" artifacts/legal-luminaire/vite.config.ts; then
            echo "FAIL: vite.config.ts contains Replit-style PORT/BASE_PATH env vars" && exit 1
          fi
          echo "  [OK] vite.config.ts: no Replit env vars"
          # CaseContext must NOT be backend-only (must reference localStorage)
          if ! grep -q "localStorage" artifacts/legal-luminaire/src/context/CaseContext.tsx; then
            echo "FAIL: CaseContext.tsx has no localStorage fallback" && exit 1
          fi
          echo "  [OK] CaseContext.tsx: localStorage fallback present"
          # citation-gate.ts must exist and export a scan function
          if ! grep -q "scanDraft\|BLOCKED\|SAFE\|WARN" artifacts/legal-luminaire/src/lib/citation-gate.ts; then
            echo "FAIL: citation-gate.ts does not appear to contain scan/gate logic" && exit 1
          fi
          echo "  [OK] citation-gate.ts: gate logic present"
          echo "Protected files integrity check: PASS"

      - name: "Week 13: Final typecheck after Week 13 changes"
        run: pnpm --filter @workspace/legal-luminaire run typecheck

  backend:
    name: Backend syntax check (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile backend (syntax check with diagnostics)
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          failures = []
          for path in Path("artifacts/legal-luminaire/backend").rglob("*.py"):
              try:
                  py_compile.compile(str(path), doraise=True)
              except py_compile.PyCompileError as exc:
                  failures.append((path, exc))
          if failures:
              for path, error in failures:
                  print(f"\nFAILED: {path}\n{error}")
              raise SystemExit(1)
          print("Backend syntax check passed")
          PY
