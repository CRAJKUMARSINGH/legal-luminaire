# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
# minimumReleaseAge disabled: CI/Netlify builds use --no-frozen-lockfile with
# packages already vetted locally. The age gate is restored for local dev by
# setting PNPM_MINIMUM_RELEASE_AGE=1440 in your shell profile.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts
  - ETERNAL_RESEARCH_CHILD

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.1
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# ignoredOptionalDependencies: intentionally empty.
# Previously listed win32-only packages which caused
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH on Netlify Linux builds.
# Native optional binaries are resolved per-platform automatically.

overrides:
  # drizzle-kit uses an older vulnerable esbuild — override it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # SECURITY: esbuild >=0.27.3 <0.28.1 vulnerable (GHSA-g7r4-m6w7-qqqr)
  esbuild: "0.28.1"
  # SECURITY: proxy-addr <2.0.8 — IP spoofing via IPv4-mapped IPv6 (GHSA-jqcg-44mw-7w3h)
  proxy-addr: ">=2.0.8"
  # SECURITY: basic-ftp multiple CVEs (GHSA-rpmf-866q-6p89 etc.) via puppeteer
  basic-ftp: ">=5.3.1"
  # SECURITY: postcss path-traversal + arbitrary file read via sourceMappingURL
  #   (GHSA-*, multiple CVEs — affects vite>postcss chain)
  postcss: ">=8.5.30"
  # SECURITY: ip-address decimal/octal mismatch enabling SSRF/trust-boundary bypass
  ip-address: ">=10.7.4"
  # SECURITY: ws memory-exhaustion DoS via tiny fragments
  ws: ">=8.22.0"
  # SECURITY: qs prototype pollution / ReDoS
  qs: ">=6.16.1"
  # SECURITY: brace-expansion DoS (multiple CVEs: OOM + stack exhaustion + regex)
  brace-expansion: ">=5.0.12"
  # SECURITY: js-yaml quadratic CPU on !!omap / merge-key chains
  js-yaml: ">=4.3.2"
  # SECURITY: braces stack-exhaustion — advisory GHSA-*. Latest release (3.0.3) is
  # the highest available. Override pins to 3.0.3; monitor for patched release >= 3.0.4.
  braces: "3.0.3"
  # SECURITY: nanoid integer overflow / infinite loop on zero/negative size
  nanoid: ">=3.3.20"
  # SECURITY: browserslist unbounded memory growth + prototype write via stats JSON
  browserslist: ">=4.29.3"
  # SECURITY: baseline-browser-mapping (transitive via browserslist)
  baseline-browser-mapping: ">=2.11.29"
  # SECURITY: source-map-js event-loop DoS via indexed source-map section offsets
  source-map-js: ">=1.2.2"
  # SECURITY: fast-uri authority injection + SSRF + path traversal (multiple CVEs)
  fast-uri: ">=3.1.8"
  # SECURITY: fast-copy (transitive — ensure latest)
  fast-copy: ">=4.2.0"
  # SECURITY: body-parser (prototype pollution / DoS)
  body-parser: ">=2.3.0"
  # SECURITY: extract-zip arbitrary file write via symlink entries — advisory GHSA-*.
  # Latest release (2.0.1) is the highest available; monitor for patched release >= 2.0.2.
  extract-zip: "2.0.1"
  # SECURITY: postcss-selector-parser (transitive via postcss)
  postcss-selector-parser: ">=7.1.0"
  # SECURITY: @babel/core <= 7.29.0 — CVE GHSA-4x5r-pxfx-6jf8 (via @vitejs/plugin-react)
  "@babel/core": ">=7.29.6"